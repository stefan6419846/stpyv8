---
name: Linux build/release workflow
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
    branches: [master]
jobs:
  build-v8:
    # If Google V8 is in the workflow cache, don't build it.
    # Cloning the repository is still necessary in any case
    # to calculate the hash for the cache key
    name: Build Google V8
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim
    outputs:
      v8-hash: ${{ steps.v8-hash.outputs.v8-hash }}
    env:
      GIT_VERSION: 2.46.4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install recent Git
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            gettext \
            libcurl4-gnutls-dev \
            libexpat1-dev \
            libpcre2-dev \
            libssl-dev \
            zlib1g-dev

          echo "::group::Install Git ${GIT_VERSION}"
          curl -fsSL \
            "https://www.kernel.org/pub/software/scm/git/git-${GIT_VERSION}.tar.gz" \
            | tar -xz

          cd "git-${GIT_VERSION}"
          make -j"$(nproc)" prefix=/usr/local all
          make prefix=/usr/local install
          cd ..

          rm -rf "git-${GIT_VERSION}"
          echo "::endgroup::"

          git --version
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            lsb-release \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            sudo \
            unzip
      - name: Set up Python environment
        run: |
          python3 -m venv /opt/stpyv8-venv
          echo "/opt/stpyv8-venv/bin" >> "$GITHUB_PATH"
      - name: Check environment
        run: |
          cat /etc/os-release
          lsb_release -a
          python3 --version
          gcc --version
          ld --version
          ldd --version
      - name: Clone Google V8
        run: |
          python3 -m pip install --upgrade setuptools wheel
          echo "::group::Clone Google V8"
          python3 setup.py checkout_v8
          echo "::endgroup::"
      - name: Calculate Google V8 hash
        id: v8-hash
        run: |
          echo "v8-hash=${{ hashFiles('v8/src/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore Google V8 from cache
        id: restore-v8
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            v8/out.gn/x64.release.sample/obj/libv8_monolith.a
            v8/out.gn/x64.release.sample/icudtl.dat
            v8/include
          key: linux-build-v8-${{ steps.v8-hash.outputs.v8-hash }}
      - name: Build Google V8
        id: build-v8
        if: ${{ steps.restore-v8.outputs.cache-hit != 'true' }}
        continue-on-error: false
        run: |
          echo "v8-hash=${{ hashFiles('v8/src/**') }}" >> "$GITHUB_OUTPUT"
          python3 -m pip install wheel
          echo "::group::v8"
          python setup.py v8
          echo "::endgroup::"
      - name: Save Google V8 to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: ${{ steps.restore-v8.outputs.cache-hit != 'true' }}
        with:
          # Save compiled binary and header files. This will save an
          # additional clone of Google V8 for the linker
          path: |
            v8/out.gn/x64.release.sample/obj/libv8_monolith.a
            v8/out.gn/x64.release.sample/icudtl.dat
            v8/include
          key: linux-build-v8-${{ steps.v8-hash.outputs.v8-hash }}
      # The artifact is the mechanism used to transfer V8 to downstream jobs.
      # It is used regardless of whether V8 came from the cache or was built.
      - name: Upload Google V8 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: google-v8-linux
          path: |
            v8/out.gn/x64.release.sample/obj/libv8_monolith.a
            v8/out.gn/x64.release.sample/icudtl.dat
            v8/include
          if-no-files-found: error
  build:
    name: Build Linux wheel (Python ${{ matrix.python-version }})
    needs: build-v8
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    env:
      DIST_NAME: stpyv8-linux-py${{ matrix.python-version }}
      STPYV8_BOOST_PYTHON: boost_python${{ matrix.python-version }}
    strategy:
      matrix:
        include:
          - python-version: '3.11'
            image: 'debian:12-slim'
            boost-version: '1.92.0'
            manylinux-platform: 'manylinux_2_35_x86_64'
          - python-version: '3.12'
            image: 'ubuntu:24.04'
            boost-version: '1.92.0'
            manylinux-platform: 'manylinux_2_39_x86_64'
          - python-version: '3.13'
            image: 'debian:13-slim'
            boost-version: '1.92.0'
            manylinux-platform: 'manylinux_2_39_x86_64'
          - python-version: '3.14'
            image: 'debian:forky-slim'  # Debian 14
            boost-version: '1.92.0'
            manylinux-platform: 'manylinux_2_39_x86_64'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            lsb-release \
            python-is-python3 \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            sudo
      - name: Check Python
        run: |
          which python3
          python3 --version
          python3 -c 'import sys; print(sys.executable)'
          python3 -c 'import sysconfig; print(sysconfig.get_path("include"))'
          python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))'
      - name: Download Boost
        id: download-boost
        uses: suisei-cn/actions-download-file@9f75b8c2dad5ccced7509c44a3b881c5613abde2  # v1.6.1
        with:
          url: https://github.com/boostorg/boost/releases/download/boost-${{ matrix.boost-version }}/boost-${{ matrix.boost-version }}-b2-nodocs.tar.xz
      - name: Install Boost
        id: install-boost
        run: |
          tar -xJf ${{ steps.download-boost.outputs.filename }}
          cd boost-${{ matrix.boost-version }}
          ./bootstrap.sh --with-libraries=python
          sudo ./b2 install -j 8 \
            --with-system \
            --with-python \
            --with-filesystem \
            --with-iostreams \
            --with-date_time \
            --with-thread \
            --without-histogram
      - name: Check Boost.Python
        run:
          ls -l /usr/local/lib/libboost*
      - name: Update LD_LIBRARY_PATH for Boost
        run:
          echo "LD_LIBRARY_PATH=/usr/local/lib:$( echo $LD_LIBRARY_PATH )" >> $GITHUB_ENV
      - name: Download Google V8 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: google-v8-linux
          path: v8
      - name: Verify Google V8 artifact
        run: |
          test -f v8/out.gn/x64.release.sample/obj/libv8_monolith.a
          echo "libv8_monolith.a exists"
          test -f v8/out.gn/x64.release.sample/icudtl.dat
          echo "icudtl.dat exists"
          test -d v8/include
          echo "include directory exists"
      - name: Set up Python environment
        run: |
          python3 -m venv /opt/stpyv8-venv
          echo "/opt/stpyv8-venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel auditwheel patchelf pytest pytest-order
      - name: Build wheel
        run: |
          python setup.py sdist bdist_wheel --skip-build-v8 -d stpyv8-linux-wheelhouse-${{ matrix.python-version }}
        env:
          INCLUDE: ${{ env.INCLUDE }};${{ steps.install-python.outputs.python-path
            }}include
          V8_DEPS_LINUX: 0
          LDFLAGS: -L/usr/lib -L/usr/lib/x86_64-linux-gnu
      - name: Repair wheel
        run: |
          auditwheel show stpyv8-linux-wheelhouse-${{ matrix.python-version }}/*.whl
          auditwheel repair --plat ${{ matrix.manylinux-platform }} -w stpyv8-linux-${{ matrix.python-version }} stpyv8-linux-wheelhouse-${{ matrix.python-version }}/*.whl
      - name: Install wheel
        run: |
          python -m pip install stpyv8-linux-${{ matrix.python-version }}/*.whl
      - name: Test wheel
        run: |
          pytest -v
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: stpyv8-linux-python${{ matrix.python-version }}
          path: stpyv8-linux-${{ matrix.python-version }}/*.whl
      #- name: Release
      #  uses: softprops/action-gh-release@v2
      #  if: ${{ github.event_name == 'release' }}
      #  with:
      #    files: stpyv8-linux-${{ matrix.python-version }}/*.whl
      #    token: ${{ secrets.GITHUB_TOKEN }}
  pypi-publish:
    name: Upload release to PyPI
    if: ${{ github.event_name == 'release' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stpyv8
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: stpyv8-linux-dist
          pattern: stpyv8-linux*
          merge-multiple: true
      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: stpyv8-linux-dist
